<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Phone - Clinic</title>
    <style>
        /* 这里可以加专属样式，必须带 .this-scene 前缀 */
        .this-scene .clue-panel-title { color: #a4303f; } /* 类似干涸的血迹颜色 */
    </style>
</head>
<body class="phone-page scene-page" data-feed-id="feed-clinic-01">
    <div class="this-scene">
        <!-- 界面右侧：线索面板 -->
        <aside class="clue-panel">
            <h2 class="clue-panel-title">午夜求医</h2>
            <p class="clue-panel-desc">
                你在西布莱尔区的一条臭水沟旁捡到了这张传单。正面是一家早就关门大吉的宠物医院，背面则用某种刺鼻的红色墨水（或者不是墨水？）写着几行警告和数字。
            </p>
            <div class="clue-hints">
                <p class="clue-hints-label">// HINTS</p>
                <p class="clue-hint-item">"传单背面有一行匆忙写下的数字，开头是 555。"</p>
                <p class="clue-hint-item">"日期旁边画着一个粗糙的缝合线图案，像个 8，又像个 0。"</p>
                <p class="clue-hint-item">"打烊时间写着 02。"</p>
                <p class="clue-hint-item">"连起来试试。希望你还没流太多血。"</p>
            </div>
        </aside>
    </div>
</body>
</html>
