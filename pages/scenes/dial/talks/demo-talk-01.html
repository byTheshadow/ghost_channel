<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Channel - 未知来电</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../../../assets/css/global.css">
    <link rel="stylesheet" href="../../../../assets/css/characters.css">
    <link rel="stylesheet" href="../../../../assets/css/scene-common.css">
    <link rel="stylesheet" href="../../../../assets/css/scene-dial-base.css">

    <style>
        .this-scene .talk-caller-name {
            text-shadow: 0 0 30px rgba(255, 0, 60, 0.8);
        }
    </style>
</head>
<body class="talk-page scene-page">

    <div class="crt-overlay"></div>
    <div class="vignette"></div>

    <nav class="ghost-nav" id="ghostNav">
        <div class="nav-brand">
            <a href="../../../../home.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
                <span class="nav-ghost-icon"></span>
                <span class="nav-title">GHOST_CHANNEL</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="../../../../home.html" class="nav-link" data-text="HOME">HOME</a>
            <a href="../../../about.html" class="nav-link" data-text="ABOUT">ABOUT</a>
            <a href="../../../characters.html" class="nav-link active" data-text="CHARACTERS">CHARACTERS</a>
            <a href="../../../gallery.html" class="nav-link" data-text="GALLERY">GALLERY</a>
            <a href="../../../presets.html" class="nav-link" data-text="PRESETS">PRESETS</a>
            <a href="../../../plugins.html" class="nav-link" data-text="PLUGINS">PLUGINS</a>
            <a href="../../../links.html" class="nav-link" data-text="LINKS">LINKS</a>
        </div>
        <button class="nav-burger" id="navBurger" aria-label="Menu"><span></span><span></span><span></span></button>
    </nav>
    <div class="mobile-menu" id="mobileMenu">
        <a href="../../../../home.html" class="mobile-link">HOME</a>
        <a href="../../../about.html" class="mobile-link">ABOUT</a>
        <a href="../../../characters.html" class="mobile-link active">CHARACTERS</a>
        <a href="../../../gallery.html" class="mobile-link">GALLERY</a>
        <a href="../../../presets.html" class="mobile-link">PRESETS</a>
        <a href="../../../plugins.html" class="mobile-link">PLUGINS</a>
        <a href="../../../links.html" class="mobile-link">LINKS</a>
    </div>

    <a href="../phones/demo-line.html" class="back-btn">← 挂断</a>

    <main class="talk-container this-scene">
        <header class="talk-header">
            <h1 class="talk-caller-name">???</h1>
            <p class="talk-status">通话中...</p>
        </header>

        <div class="talk-messages">
            <!-- 对方开场白 -->
            <div class="talk-message from-them" data-delay="500" data-typewriter="true">
                <div class="talk-bubble">……</div>
            </div>

            <div class="talk-message from-them" data-delay="2500" data-typewriter="true">
                <div class="talk-bubble">你打过来了。</div>
            </div>

            <div class="talk-message from-them" data-delay="5000" data-typewriter="true">
                <div class="talk-bubble">我以为你不会。</div>
            </div>

            <!-- 用户选择后显示 -->
            <div class="talk-message from-user" data-option-id="opt1" style="display:none;">
                <div class="talk-bubble">你是谁？</div>
            </div>
            <div class="talk-message from-user" data-option-id="opt2" style="display:none;">
                <div class="talk-bubble">……（沉默）</div>
            </div>

            <!-- 对方回复 -->
            <div class="talk-message from-them" data-reply-to="opt1" style="display:none;" data-typewriter="true">
                <div class="talk-bubble">这个问题……现在还不重要。</div>
            </div>
            <div class="talk-message from-them" data-reply-to="opt2" style="display:none;" data-typewriter="true">
                <div class="talk-bubble">沉默也是一种回答。我懂。</div>
            </div>

            <!-- 第二轮对方继续 -->
            <div class="talk-message from-them" data-reply-to="opt1" style="display:none;" data-typewriter="true">
                <div class="talk-bubble">重要的是——你为什么会有这个号码。</div>
            </div>
            <div class="talk-message from-them" data-reply-to="opt2" style="display:none;" data-typewriter="true">
                <div class="talk-bubble">不过,你能打过来,说明你已经开始在意了。</div>
            </div>
        </div>

        <!-- 第一轮选项 -->
        <div class="talk-options" data-round="1">
            <button class="talk-option-btn" data-option-id="opt1">你是谁？</button>
            <button class="talk-option-btn" data-option-id="opt2">……（沉默）</button>
        </div>

        <!-- 通话结束(第二轮回复后显示) -->
        <div class="talk-end" id="talkEnd" style="display:none;">
            <p class="talk-end-text">// 对方已挂断</p>
            <p class="talk-end-time">通话时长: 00:47</p>
        </div>
    </main>

    <script src="../../../../assets/data/scenes/_registry.js"></script>
    <script src="../../../../assets/js/scene-dial.js"></script>
    <script>
        // 汉堡菜单
        const burger = document.getElementById('navBurger');
        const menu = document.getElementById('mobileMenu');
        if (burger && menu) {
            burger.addEventListener('click', () => {
                burger.classList.toggle('active');
                menu.classList.toggle('active');
            });
        }

        // 第一轮选完后,延迟显示通话结束
        document.querySelectorAll('.talk-option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setTimeout(() => {
                    document.getElementById('talkEnd').style.display = 'block';
                    document.querySelector('.talk-status').textContent = '通话已结束';
                }, 6000);
            });
        });
    </script>
</body>
</html>
