    <script>
        window.THREAD_DATA = {
            title:   '昨夜在锦瑟巷淘到一支旧乌木笔，写出的字竟如活物，但总觉得哪里不对……',
            section: '【大晟】鬼市留言壁',
            op: {
                name:   '落榜闲人',
                avatar: '',
                level:  2,
                time:   '1023-09-07 21:15'
            },
            floors: [
                {
                    name:    '落榜闲人',
                    avatar:  '',
                    level:   2,
                    time:    '1023-09-07 21:15',
                    isOP:    true,
                    content: '诸位，小生今年秋闱又落榜了。昨夜心灰意冷，去城北的锦瑟巷闲逛，在一个瞎眼老叟的地摊上买了支带裂纹的旧乌木笔。\n本想买回来随便练练字，结果奇了。一握住那笔，就像着了魔，字迹铁画银钩，绝非我平日那般软弱无力。只是抄书时会彻底忘却时辰，一写就是一整夜。\n今日同窗看我的眼神怪怪的，说我昨晚连灯都没点，闭着眼睛在悬腕狂草。我现在觉得手脚冰凉，是不是惹上什么不干净的东西了？'
                },
                {
                    name:    '平康坊常客',
                    avatar:  '',
                    level:   5,
                    time:    '1023-09-07 21:30',
                    content: '兄弟，你确定不是自己偷偷去了趟平康坊掏空了身子？读书人压力大我懂，实在不行去聆月阁听听清倌弹琴静静心，别老疑神疑鬼的。'
                },
                {
                    name:    '洛阳铲',
                    avatar:  '',
                    level:   8,
                    time:    '1023-09-07 21:45',
                    content: '锦瑟巷？那地方多是土里刨出来的明器。那瞎眼老叟……莫不是专收“血煞件”的鬼手？\n楼主听我一句劝，那笔八成带了前主人的怨气。赶紧弄点纯正的雄黄酒把手好好洗洗，笔直接烧了！'
                },
                {
                    name:    '镜湖打渔人',
                    avatar:  '',
                    level:   3,
                    time:    '1023-09-07 22:05',
                    content: '别搁这吓唬读书人了。依我看，就是秋闱落榜，心有不甘，生了癔症。好好睡一觉比什么都强。'
                },
                {
                    name:    '落榜闲人',
                    avatar:  '',
                    level:   2,
                    time:    '1023-09-08 14:20',
                    isOP:    true,
                    content: '多谢各位……我白日里越看那笔越觉得瘆人，笔杆上的裂纹像是在往外渗墨。 \n我胆子小，没敢烧，趁着午后人少，用布包着偷偷扔进镜湖书院旁边的深水区了。这下应该没事了吧？'
                },
                {
                    name:    '洛阳铲',
                    avatar:  '',
                    level:   8,
                    time:    '1023-09-08 14:35',
                    quote:   { name: '落榜闲人', excerpt: '扔进镜湖书院旁边的深水区了' },
                    content: '糊涂啊！水生阴，木生水，你把它扔水里，还是书院旁边那种文人意念聚拢的地方……哎，自求多福吧。'
                },
                {
                    name:    '落榜闲人',
                    avatar:  '',
                    level:   2,
                    time:    '1023-09-08 23:45',
                    isOP:    true,
                    content: '它回来了。\n\n我刚才回书舍推开门，那支笔湿漉漉地搁在我的砚台上，还在滴水。\n桌上铺着的生宣上，洇出了一行红色的字：\n\n“ 何  故  弃  我  ？ ”\n\n字迹……是我自己的。我手抖得停不下来，谁来救救我。'
                },
                {
                    name:    '神都巡街武侯',
                    avatar:  '',
                    level:   15,
                    time:    '1023-09-08 23:55',
                    content: '休要惊慌。你买的那种劣质乌木笔，笔杆多用生犀漆混合朱砂填补裂缝。受潮后，朱砂与劣漆混合会挥发微量致幻毒气，你这是中了毒产生幻觉，自己写了字都不记得。\n\n你家住哪个书舍？明日一早本使带人来查房，将此有毒违禁物交予官府统一销毁。切记，今夜锁好门窗，切勿再碰那支笔。'
                }
            ]
        };
