<!DOCTYPE html>
<!--
    ============================================================
    GHOST CHANNEL — 论坛帖子详情页模板
    ============================================================
    使用方法：
      1. 复制本文件，重命名为 thread-XXX.html
      2. 修改 window.THREAD_DATA 中的所有内容
      3. 在 <style> 里写个性化 CSS，选择器必须以 .this-scene 开头
      4. 在 _registry.js 的 forum 数组末尾 append 对应条目

    路径规则（详情页视角）：
      CSS：  ../../../../assets/css/xxx.css
      JS：   ../../../../assets/js/xxx.js
      图片： ../../../../assets/images/xxx
      返回：  ../index.html
    ============================================================
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[FILL_ME:标题] · Ghost_BBS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=UnifrakturCook:wght@700&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../../../assets/css/global.css">
    <link rel="stylesheet" href="../../../../assets/css/characters.css">
    <link rel="stylesheet" href="../../../../assets/css/scene-common.css">
    <link rel="stylesheet" href="../../../../assets/css/scene-forum-base.css">

    <style>
        body, html { overflow: visible; height: auto; }

        /* 个性化 CSS 示例（都必须以 .this-scene 开头） */
        /*
        .this-scene .thread-header { border-color: var(--red-bright); }
        .this-scene .floor-content { font-family: 'ZCOOL QingKe HuangYou', serif; }
        */
    </style>
</head>
<body class="scene-page forum-page this-scene">

    <div class="crt-overlay"></div>
    <div class="vignette"></div>

    <nav class="ghost-nav" id="ghostNav">
        <div class="nav-brand">
            <a href="../../../../home.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
                <span class="nav-ghost-icon"></span>
                <span class="nav-title">GHOST_CHANNEL</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="../../../../home.html" class="nav-link" data-text="HOME">HOME</a>
            <a href="../../../about.html" class="nav-link" data-text="ABOUT">ABOUT</a>
            <a href="../../../characters.html" class="nav-link active" data-text="CHARACTERS">CHARACTERS</a>
            <a href="../../../gallery.html" class="nav-link" data-text="GALLERY">GALLERY</a>
            <a href="../../../presets.html" class="nav-link" data-text="PRESETS">PRESETS</a>
            <a href="../../../plugins.html" class="nav-link" data-text="PLUGINS">PLUGINS</a>
            <a href="../../../links.html" class="nav-link" data-text="LINKS">LINKS</a>
        </div>
        <button class="nav-burger" id="navBurger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>
    <div class="mobile-menu" id="mobileMenu">
        <a href="../../../../home.html" class="mobile-link">HOME</a>
        <a href="../../../about.html" class="mobile-link">ABOUT</a>
        <a href="../../../characters.html" class="mobile-link active">CHARACTERS</a>
        <a href="../../../gallery.html" class="mobile-link">GALLERY</a>
        <a href="../../../presets.html" class="mobile-link">PRESETS</a>
        <a href="../../../plugins.html" class="mobile-link">PLUGINS</a>
        <a href="../../../links.html" class="mobile-link">LINKS</a>
    </div>

    <a href="../index.html" class="back-btn">← BACK TO FORUM</a>

    <div class="thread-detail-wrap">
        <!-- 帖子标题（JS 渲染） -->
        <div id="threadHeader"></div>

        <!-- 楼层列表（JS 渲染） -->
        <div id="threadFloors"></div>

        <!-- 底部分页占位 -->
        <div class="thread-footer">
            <span class="page-btn disabled">&lt; 上一页</span>
            <span class="page-btn active">1</span>
            <span class="page-btn disabled">下一页 &gt;</span>
        </div>
    </div>

    <!-- 侧边纸条（可选） -->
    <div class="side-notes">
        <div class="note" style="--rot:-3deg;">
            [FILL_ME:可选纸条，记录者手写批注]
        </div>
    </div>

    <button class="help-btn" id="helpBtn" aria-label="Help">?</button>
    <div class="help-panel" id="helpPanel">
        <h4>// THREAD</h4>
        <ul>
            <li>楼层按发言时间排序</li>
            <li>金色 <span style="color:#ffd93d;">LZ</span> = 楼主</li>
            <li>左侧红条 = 引用回复</li>
        </ul>
    </div>

    <!-- ============================================================
         本页数据：楼层内容
         [FILL_ME] 请填以下字段
         ============================================================ -->
    <script>
        window.THREAD_DATA = {
            title:   '[FILL_ME:帖子标题]',
            section: '[FILL_ME:板块，如 灵异discuss]',
            op: {
                name:   '[FILL_ME:楼主昵称]',
                avatar: '',   // 可留空，会显示昵称首字母
                level:  1,
                time:   '[FILL_ME:YYYY-MM-DD HH:MM]'
            },
            floors: [
                {
                    name:    '[FILL_ME:楼主昵称]',
                    avatar:  '',
                    level:   1,
                    time:    '[FILL_ME:YYYY-MM-DD HH:MM]',
                    isOP:    true,
                    content: '[FILL_ME:楼主正文。支持换行。]'
                },
                {
                    name:    '[FILL_ME:回帖人]',
                    avatar:  '',
                    level:   2,
                    time:    '[FILL_ME:YYYY-MM-DD HH:MM]',
                    content: '[FILL_ME:回复内容]',
                    quote:   null   // 或 { name: '被引用人', excerpt: '被引用的原文' }
                },
                // ... 建议 5-30 层
            ]
        };
    </script>

    <!-- 楼层渲染 -->
    <script>
    (function() {
        const data = window.THREAD_DATA;
        if (!data) return;

        const headerEl = document.getElementById('threadHeader');
        const floorsEl = document.getElementById('threadFloors');
        document.title = `${data.title} · Ghost_BBS`;

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }
        function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }
        function initial(n) { return n ? String(n).trim().charAt(0).toUpperCase() : '?'; }

        // 标题栏
        headerEl.innerHTML = `
            <div class="thread-header">
                <span class="th-section">${esc(data.section)}</span>
                <h1 class="th-title">${esc(data.title)}</h1>
                <div class="th-op">
                    <span>楼主</span>
                    <span class="op-sep">·</span>
                    <span class="op-name">${esc(data.op.name)}</span>
                    <span class="op-sep">·</span>
                    <span>Lv.${esc(data.op.level || 1)}</span>
                    <span class="op-sep">·</span>
                    <span>${esc(data.op.time)}</span>
                </div>
            </div>
        `;

        // 楼层
        floorsEl.className = 'thread-floors';
        floorsEl.innerHTML = data.floors.map((f, i) => {
            const num = i === 0 ? '楼主' : `${i}F`;
            const avatarHtml = f.avatar && f.avatar.trim()
                ? `<img class="user-avatar" src="${escAttr(f.avatar)}" alt="${escAttr(f.name)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'avatar-fallback',textContent:'${escAttr(initial(f.name))}'}))">`
                : `<div class="avatar-fallback">${esc(initial(f.name))}</div>`;
            const opBadge = f.isOP ? `<span class="op-badge">LZ</span>` : '';
            const quoteHtml = f.quote ? `
                <div class="floor-quote">
                    <span class="quote-author">${esc(f.quote.name)}</span>${esc(f.quote.excerpt)}
                </div>
            ` : '';
            return `
                <div class="floor">
                    <div class="floor-user">
                        ${avatarHtml}
                        <div class="user-name">${esc(f.name)}</div>
                        ${opBadge}
                        <div class="user-level">Lv.${esc(f.level || 1)}</div>
                    </div>
                    <div class="floor-body">
                        <div class="floor-meta">
                            <span class="floor-num">${esc(num)}</span>
                            <span class="floor-time">${esc(f.time)}</span>
                        </div>
                        ${quoteHtml}
                        <div class="floor-content">${esc(f.content)}</div>
                    </div>
                </div>
            `;
        }).join('');
    })();
    </script>

    <script>
        const burger = document.getElementById('navBurger');
        const menu = document.getElementById('mobileMenu');
        if (burger && menu) {
            burger.addEventListener('click', () => {
                burger.classList.toggle('active');
                menu.classList.toggle('active');
            });
        }
        const helpBtn = document.getElementById('helpBtn');
        const helpPanel = document.getElementById('helpPanel');
        if (helpBtn && helpPanel) {
            helpBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                helpPanel.classList.toggle('open');
            });
            document.addEventListener('click', (e) => {
                if (!helpPanel.contains(e.target) && e.target !== helpBtn) {
                    helpPanel.classList.remove('open');
                }
            });
        }
    </script>
</body>
</html>
